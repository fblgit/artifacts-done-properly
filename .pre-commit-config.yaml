# pip install pre-commit && pre-commit install   (installs the commit and the push hooks)
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3          # same version CI runs
    hooks:
      - id: gitleaks
        stages: [pre-push]          # secrets are checked on push: the whole history; the config (default rules plus one allowlisted path) is inline, as in ci.yml
        entry: >-
          bash -c 'GITLEAKS_CONFIG_TOML="[extend]
          useDefault = true
          [allowlist]
          paths = [\"skill/catalog/kit/samples/patterns\\\\.json\"]" gitleaks git --redact --verbose'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff           # rules and excludes: ruff.toml
  - repo: local
    hooks:
      - id: skill-frontmatter
        name: skill frontmatter (SKILL.md files)
        entry: python3 tools/package.py --check
        language: system
        pass_filenames: false
        files: ^(skill/.*SKILL\.md|tools/package\.py)$
      - id: catalog-check
        name: catalog sizes, sha256 and hashes
        entry: python3 skill/scripts/adp_catalog.py
        language: system
        pass_filenames: false
        files: ^(skill/catalog/|skill/scripts/adp_(catalog|lib)\.py)
      - id: catalog-roundtrip
        name: catalog roundtrip (headers, index, files, take, seed, previews)
        entry: python3 -I tools/roundtrip.py
        language: system
        pass_filenames: false
        stages: [pre-push]          # about 9 s: on push, not on every commit
        files: ^(skill/|tools/roundtrip\.py)
      - id: catalog-headers
        name: catalog entry headers (docs/catalog-header.md)
        entry: python3 skill/scripts/adp_catalog.py headers
        language: system
        files: ^skill/catalog/.*\.(js|css|md|txt)$      # a main file without a valid header blocks the commit
