name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The gitleaks config lives here, not in a .toml file at the repo root (the plugin directory takes no .toml). It extends the
          # default rules; two samples in the catalog's bundle of pattern samples (sandbox and timed-reveal: demo inputs for the
          # redaction and timed-reveal components) hold fake values. Keep it equal to the hook in .pre-commit-config.yaml.
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true

            [allowlist]
            description = "fake demo values in the catalog's pattern samples"
            paths = [
              '''skill/catalog/kit/samples/patterns\.json''',
            ]

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.9 && ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 tools/package.py --check
      - name: The plugin tree builds (skills/<name>/SKILL.md layout)
        run: python3 tools/package.py --plugin --out "$RUNNER_TEMP/plugin-build" && test -f "$RUNNER_TEMP/plugin-build/plugin/skills/adp-new/SKILL.md"
      - run: python3 skill/scripts/adp_catalog.py
      - name: Catalog roundtrip (node comes with the runner image; the script fails when it is missing)
        run: python3 -I tools/roundtrip.py --require-node

  # The plugin as the directory reads it: the repo as it is, and the tree package.py --plugin builds. --profile directory fails on what the
  # directory refuses, --strict on its warnings too. Claude Code runs through npx, unpinned on purpose: the check follows the current CLI.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate the repository as a plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate . --profile directory --strict
      - name: Validate the built plugin tree
        run: |
          python3 tools/package.py --plugin --out "$RUNNER_TEMP/plugin-build"
          npx --yes @anthropic-ai/claude-code plugin validate "$RUNNER_TEMP/plugin-build/plugin" --profile directory --strict

  # Build once per content: the key is the git trees of everything the bundle is made from, so a merge that changes
  # nothing in them finds the bundle a PR commit already built and builds nothing. Promotion (the release) takes that
  # same file and checks its hash.
  bundle:
    needs: [secrets, lint, tests, skill]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write        # delete the PR's superseded bundle
      pull-requests: write  # the one comment per PR
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Content key and an existing bundle for it
        id: key
        run: |
          KEY=$(git rev-parse HEAD:skill HEAD:LICENSE HEAD:NOTICE HEAD:tools/package.py | sha256sum | cut -c1-16)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=adp-skill-$KEY&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | first | select(. != null) | "id=\(.id)\nrun=\(.workflow_run.id)"' >> "$GITHUB_OUTPUT"
      - name: Reuse it, and check its hash
        if: steps.key.outputs.id != ''
        run: |
          gh run download "${{ steps.key.outputs.run }}" -n "adp-skill-${{ steps.key.outputs.key }}" -D dist
          (cd dist && sha256sum -c adp.skill.sha256)
      - name: Build it (new content)
        if: steps.key.outputs.id == ''
        run: python3 tools/package.py
      - name: Keep it
        id: up
        if: steps.key.outputs.id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adp-skill-${{ steps.key.outputs.key }}
          path: dist/
          if-no-files-found: error
      - name: PR comment and the PR's superseded bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEY: ${{ steps.key.outputs.key }}
          ARTIFACT: ${{ steps.up.outputs.artifact-id || steps.key.outputs.id }}
          RUN: ${{ steps.key.outputs.run || github.run_id }}
          REUSED: ${{ steps.key.outputs.id != '' }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # an older bundle of this branch is dropped: one downloadable bundle per PR, the newest
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BRANCH\") | select(.name | startswith(\"adp-skill-\")) | select(.name != \"adp-skill-$KEY\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
          python3 - <<'PY'
          import json, os, subprocess, datetime
          e, repo = os.environ, os.environ['GITHUB_REPOSITORY']
          def gh(*a, inp=None):
              return subprocess.run(['gh', 'api', *a], input=inp, capture_output=True, text=True, check=True).stdout
          mark = '<!-- adp-skill-bundle -->'
          comments = json.loads(gh(f'repos/{repo}/issues/{e["PR"]}/comments', '--paginate', '--slurp'))
          mine = next((c for page in comments for c in page if mark in c['body']), None)
          sha256 = open('dist/adp.skill.sha256').read().split()[0]
          size = os.path.getsize('dist/adp.skill')
          row = f'| `{e["SHA"][:7]}` | {datetime.datetime.now(datetime.timezone.utc):%Y-%m-%d %H:%M} UTC | `{sha256[:12]}` | {size:,} B | {"reused" if e["REUSED"] == "true" else "built"} |'
          rows = [l for l in (mine['body'].splitlines() if mine else []) if l.startswith('| `') and f'`{e["SHA"][:7]}`' not in l]
          url = f'https://github.com/{repo}/actions/runs/{e["RUN"]}/artifacts/{e["ARTIFACT"]}'
          body = '\n'.join([mark, f'**`adp.skill` for `{e["SHA"][:7]}`**: [download]({url}) (signed-in; only the latest is kept)', '',
                            f'SHA-256 `{sha256}`', '', 'History (hashes only, older bundles are deleted):', '',
                            '| commit | built | SHA-256 | size | |', '|---|---|---|---|---|', row, *rows])
          payload = json.dumps({'body': body})
          if mine: gh('-X', 'PATCH', f'repos/{repo}/issues/comments/{mine["id"]}', '--input', '-', inp=payload)
          else: gh('-X', 'POST', f'repos/{repo}/issues/{e["PR"]}/comments', '--input', '-', inp=payload)
          PY
