name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests and checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/package.py --check
          python3 tools/check_catalog.py
      - name: Build bundle
        run: python3 tools/package.py
      - name: Verify tag matches skill version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import package
          with open("skill/SKILL.md", encoding="utf-8") as f:
              fm = package.parse_frontmatter(f.read())
          print((fm.get("metadata") or {}).get("version", ""))
          PY
          )
          if [ -z "$VERSION" ]; then
            echo "::error::skill/SKILL.md has no metadata.version"; exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match skill version v$VERSION; bump metadata.version in skill/SKILL.md or retag"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA=$(cut -d' ' -f1 dist/adp.skill.sha256)
          printf 'Skill bundle `adp.skill`.\n\nSHA-256: `%s`\n\nVerify: `sha256sum -c adp.skill.sha256`\n' "$SHA" > notes.md
          gh release create "$TAG" dist/adp.skill dist/adp.skill.sha256 \
            --title "$TAG" --generate-notes --notes-file notes.md
